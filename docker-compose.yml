services:
  mysql-service:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: django_db
      MYSQL_USER: django_user
      MYSQL_PASSWORD: django_password_123
      MYSQL_ROOT_PASSWORD: root_password_123
    volumes:
      - mysql_local_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password_123"]
      interval: 5s
      timeout: 3s
      retries: 20

  django:
    build:
      context: ./app
    environment:
      DB_HOST: mysql-service
      DB_PORT: "3306"
      DB_NAME: django_db
      DB_USER: django_user
      DB_PASSWORD: django_password_123
    ports:
      - "8000:8000"
    depends_on:
      mysql-service:
        condition: service_healthy

volumes:
  mysql_local_data:
