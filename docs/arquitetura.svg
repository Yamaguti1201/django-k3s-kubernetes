<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #475569; }
      .box-title { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .box-sub { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .box-meta { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .zone-title { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .edge-label { font: 600 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .pill { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .shadow { filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.08)); }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4338ca"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#db2777"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1440" height="860" rx="16"/>

  <!-- Header -->
  <text x="48" y="48" class="title">Arquitetura do Cluster Kubernetes (K3s) — Django + MySQL</text>
  <text x="48" y="72" class="subtitle">Atividade Prática • 2 VMs no Microsoft Azure (Control Plane dedicado + Worker) • Rede Privada • Persistência PV/PVC</text>

  <!-- External Left Column -->
  <!-- User / Browser -->
  <g class="shadow">
    <rect x="48" y="185" width="224" height="118" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="48" y="185" width="224" height="32" rx="14" fill="#2563eb"/>
    <rect x="48" y="203" width="224" height="14" fill="#2563eb"/>
    <text x="160" y="206" text-anchor="middle" class="box-title" fill="#ffffff">Usuário / Navegador</text>
    <text x="160" y="242" text-anchor="middle" class="box-sub" fill="#1e3a8a">Acesso Externo HTTP</text>
    <text x="160" y="264" text-anchor="middle" class="box-meta" fill="#1e40af">http://&lt;IP_PUBLICO_VM2&gt;:30080</text>
    <text x="160" y="286" text-anchor="middle" class="box-meta" fill="#475569">Cadastro (/) • Consulta (/registros/)</text>
  </g>

  <!-- Docker Hub -->
  <g class="shadow">
    <rect x="48" y="445" width="224" height="122" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect x="48" y="445" width="224" height="32" rx="14" fill="#16a34a"/>
    <rect x="48" y="463" width="224" height="14" fill="#16a34a"/>
    <text x="160" y="466" text-anchor="middle" class="box-title" fill="#ffffff">Docker Hub (Registry)</text>
    <text x="160" y="502" text-anchor="middle" class="box-sub" fill="#14532d">yamaguti01/django-k3s:v1</text>
    <text x="160" y="523" text-anchor="middle" class="box-meta" fill="#166534">Multi-arch: linux/amd64 + arm64</text>
    <text x="160" y="546" text-anchor="middle" class="box-meta" fill="#475569">Imagem oficial: mysql:8.0</text>
  </g>

  <!-- Azure VNet Container -->
  <rect x="336" y="102" width="1056" height="672" rx="18" fill="#ffffff" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="10 6"/>
  <rect x="356" y="88" width="440" height="28" rx="14" fill="#0284c7"/>
  <text x="576" y="107" text-anchor="middle" class="zone-title" fill="#ffffff">Microsoft Azure — Rede Privada (VNet / Subnet)</text>

  <!-- VM1 Control Plane -->
  <g class="shadow">
    <rect x="366" y="168" width="290" height="418" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <rect x="366" y="168" width="290" height="56" rx="16" fill="#d97706"/>
    <rect x="366" y="206" width="290" height="18" fill="#d97706"/>
    <text x="511" y="191" text-anchor="middle" class="zone-title" fill="#ffffff">VM1 — Control Plane</text>
    <text x="511" y="211" text-anchor="middle" class="box-meta" fill="#fef3c7">K3s Server • Gerenciamento do Cluster</text>

    <!-- Taint Badge -->
    <rect x="386" y="238" width="250" height="34" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="511" y="259" text-anchor="middle" class="pill" fill="#92400e">Taint: NoSchedule (sem Pods da app)</text>

    <!-- K3s Control Plane Components -->
    <rect x="386" y="288" width="250" height="110" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <text x="511" y="313" text-anchor="middle" class="box-title" fill="#92400e">K3s Server Components</text>
    <text x="511" y="335" text-anchor="middle" class="box-meta" fill="#334155">• kube-apiserver (TCP :6443)</text>
    <text x="511" y="355" text-anchor="middle" class="box-meta" fill="#334155">• kube-scheduler &amp; controller-manager</text>
    <text x="511" y="375" text-anchor="middle" class="box-meta" fill="#334155">• Datastore / estado do cluster</text>

    <!-- kubectl management -->
    <rect x="386" y="414" width="250" height="104" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="511" y="440" text-anchor="middle" class="box-title" fill="#92400e">Operação via kubectl</text>
    <text x="511" y="462" text-anchor="middle" class="box-meta" fill="#334155">kubectl apply -f k8s/</text>
    <text x="511" y="482" text-anchor="middle" class="box-meta" fill="#334155">kubectl scale deployment django --replicas=3</text>
    <text x="511" y="502" text-anchor="middle" class="box-meta" fill="#334155">kubectl get nodes,pods,services -o wide</text>

    <!-- Network note -->
    <text x="511" y="558" text-anchor="middle" class="box-meta" fill="#b45309">IP Privado na VNet • NSG: 22, 6443</text>
  </g>

  <!-- VM2 Worker Node -->
  <g class="shadow">
    <rect x="734" y="168" width="628" height="578" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <rect x="734" y="168" width="628" height="56" rx="16" fill="#4f46e5"/>
    <rect x="734" y="206" width="628" height="18" fill="#4f46e5"/>
    <text x="1048" y="191" text-anchor="middle" class="zone-title" fill="#ffffff">VM2 — Worker Node (K3s Agent)</text>
    <text x="1048" y="211" text-anchor="middle" class="box-meta" fill="#e0e7ff">Execução exclusiva dos Pods Django e MySQL • NSG: 22, 30080</text>

    <!-- Service Django (NodePort) -->
    <rect x="756" y="242" width="242" height="102" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="877" y="266" text-anchor="middle" class="box-title" fill="#1e3a8a">Service: django-service</text>
    <rect x="817" y="275" width="120" height="22" rx="11" fill="#2563eb"/>
    <text x="877" y="290" text-anchor="middle" class="pill" fill="#ffffff">NodePort :30080</text>
    <text x="877" y="315" text-anchor="middle" class="box-meta" fill="#1e40af">Encaminha :30080 → targetPort :8000</text>
    <text x="877" y="332" text-anchor="middle" class="box-meta" fill="#334155">Balanceia tráfego entre réplicas</text>

    <!-- Deployment Django -->
    <rect x="1048" y="238" width="288" height="110" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
    <text x="1192" y="262" text-anchor="middle" class="box-title" fill="#312e81">Deployment: django</text>
    <text x="1192" y="281" text-anchor="middle" class="box-meta" fill="#4338ca">Pods Django 5 + Gunicorn (porta 8000)</text>
    <!-- Replica pills -->
    <rect x="1068" y="291" width="76" height="22" rx="6" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="1106" y="306" text-anchor="middle" class="pill" fill="#312e81">Pod 1</text>
    <rect x="1154" y="291" width="76" height="22" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 2"/>
    <text x="1192" y="306" text-anchor="middle" class="pill" fill="#475569">Pod 2*</text>
    <rect x="1240" y="291" width="76" height="22" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 2"/>
    <text x="1278" y="306" text-anchor="middle" class="pill" fill="#475569">Pod 3*</text>
    <text x="1192" y="333" text-anchor="middle" class="box-meta" fill="#475569">DB_HOST=mysql-service • /health/ probes</text>

    <!-- Secret -->
    <rect x="756" y="384" width="242" height="92" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="1.8"/>
    <text x="877" y="409" text-anchor="middle" class="box-title" fill="#831843">Secret: mysql-secret</text>
    <text x="877" y="430" text-anchor="middle" class="box-meta" fill="#9d174d">MYSQL_DATABASE • MYSQL_USER</text>
    <text x="877" y="447" text-anchor="middle" class="box-meta" fill="#9d174d">MYSQL_PASSWORD • ROOT_PASSWORD</text>
    <text x="877" y="464" text-anchor="middle" class="box-meta" fill="#9d174d">DJANGO_SECRET_KEY</text>

    <!-- Service MySQL (ClusterIP) -->
    <rect x="1048" y="384" width="288" height="92" rx="12" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <text x="1192" y="409" text-anchor="middle" class="box-title" fill="#312e81">Service: mysql-service</text>
    <rect x="1127" y="418" width="130" height="22" rx="11" fill="#4338ca"/>
    <text x="1192" y="433" text-anchor="middle" class="pill" fill="#ffffff">ClusterIP :3306</text>
    <text x="1192" y="460" text-anchor="middle" class="box-meta" fill="#3730a3">Comunicação interna Django → MySQL</text>

    <!-- Deployment MySQL -->
    <rect x="1048" y="510" width="288" height="94" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="1192" y="535" text-anchor="middle" class="box-title" fill="#134e4a">Deployment: mysql</text>
    <text x="1192" y="555" text-anchor="middle" class="box-sub" fill="#0f766e">Pod MySQL 8.0 • strategy: Recreate</text>
    <text x="1192" y="575" text-anchor="middle" class="box-meta" fill="#334155">Volume montado em /var/lib/mysql</text>
    <text x="1192" y="592" text-anchor="middle" class="box-meta" fill="#475569">Probes: mysqladmin ping &amp; TCP :3306</text>

    <!-- PVC -->
    <rect x="756" y="632" width="242" height="90" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="877" y="657" text-anchor="middle" class="box-title" fill="#134e4a">PVC: mysql-pvc</text>
    <text x="877" y="678" text-anchor="middle" class="box-meta" fill="#115e59">AccessMode: ReadWriteOnce</text>
    <text x="877" y="697" text-anchor="middle" class="box-meta" fill="#115e59">Storage: 2Gi • storageClassName: manual</text>

    <!-- PV (Cylinder look) -->
    <g>
      <path d="M 1048 648 C 1048 636, 1336 636, 1336 648 L 1336 710 C 1336 722, 1048 722, 1048 710 Z" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/>
      <ellipse cx="1192" cy="648" rx="144" ry="12" fill="#5eead4" stroke="#0f766e" stroke-width="2"/>
      <text x="1192" y="677" text-anchor="middle" class="box-title" fill="#134e4a">PV: mysql-pv (Persistência)</text>
      <text x="1192" y="696" text-anchor="middle" class="box-meta" fill="#115e59">hostPath: /mnt/data/mysql • Retain (2Gi)</text>
    </g>
  </g>

  <!-- ARROWS / CONNECTORS -->
  <!-- User -> Service Django (NodePort 30080) -->
  <path d="M 272 244 L 312 244 L 312 140 L 877 140 L 877 238" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="448" y="128" width="218" height="24" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="557" y="144" text-anchor="middle" class="edge-label" fill="#1d4ed8">HTTP Externo • Porta 30080</text>

  <!-- Docker Hub -> VM2 -->
  <path d="M 272 506 L 312 506 L 312 695 L 730 695" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow-green)"/>
  <rect x="404" y="681" width="224" height="24" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="516" y="697" text-anchor="middle" class="edge-label" fill="#166534">Pull de imagens (Django &amp; MySQL)</text>

  <!-- VM1 <-> VM2 (Private Network K3s) -->
  <path d="M 656 344 L 730 344" fill="none" stroke="#d97706" stroke-width="2.5" marker-start="url(#arrow-amber)" marker-end="url(#arrow-amber)"/>
  <rect x="652" y="358" width="86" height="44" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="695" y="376" text-anchor="middle" class="edge-label" fill="#92400e">VNet :6443</text>
  <text x="695" y="392" text-anchor="middle" class="box-meta" fill="#b45309">Flannel</text>

  <!-- Service Django -> Deployment Django -->
  <path d="M 998 293 L 1044 293" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="1021" y="283" text-anchor="middle" class="edge-label" fill="#1d4ed8">:8000</text>

  <!-- Deployment Django -> Service MySQL -->
  <path d="M 1192 348 L 1192 380" fill="none" stroke="#4338ca" stroke-width="2.5" marker-end="url(#arrow-indigo)"/>
  <text x="1238" y="368" text-anchor="middle" class="edge-label" fill="#3730a3">TCP :3306</text>

  <!-- Service MySQL -> Deployment MySQL -->
  <path d="M 1192 476 L 1192 506" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="1222" y="495" text-anchor="middle" class="edge-label" fill="#0f766e">:3306</text>

  <!-- Deployment MySQL -> PVC -->
  <path d="M 1048 557 L 877 557 L 877 628" fill="none" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <rect x="900" y="545" width="124" height="22" rx="11" fill="#f0fdfa" stroke="#0d9488" stroke-width="1"/>
  <text x="962" y="560" text-anchor="middle" class="edge-label" fill="#115e59">Volume Mount</text>

  <!-- PVC -> PV -->
  <path d="M 998 677 L 1044 677" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="1021" y="667" text-anchor="middle" class="edge-label" fill="#115e59">Bind</text>

  <!-- Secret -> Django & MySQL -->
  <path d="M 998 408 L 1024 408 L 1024 318 L 1044 318" fill="none" stroke="#db2777" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-pink)"/>
  <path d="M 998 452 L 1024 452 L 1024 536 L 1044 536" fill="none" stroke="#db2777" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-pink)"/>

  <!-- Legend Footer -->
  <rect x="48" y="794" width="1344" height="46" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="72" y="822" class="box-sub" fill="#334155">Legenda:</text>
  <line x1="150" y1="817" x2="184" y2="817" stroke="#2563eb" stroke-width="2.5"/>
  <text x="194" y="822" class="box-meta" fill="#334155">Tráfego HTTP / NodePort</text>
  <line x1="365" y1="817" x2="399" y2="817" stroke="#4338ca" stroke-width="2.5"/>
  <text x="409" y="822" class="box-meta" fill="#334155">ClusterIP Interno (:3306)</text>
  <line x1="578" y1="817" x2="612" y2="817" stroke="#0f766e" stroke-width="2.5"/>
  <text x="622" y="822" class="box-meta" fill="#334155">Armazenamento Persistente (PV/PVC)</text>
  <line x1="862" y1="817" x2="896" y2="817" stroke="#db2777" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="906" y="822" class="box-meta" fill="#334155">Injeção de Variáveis (Secret)</text>
  <text x="1110" y="822" class="box-meta" fill="#64748b">*Réplicas 2 e 3 ativadas no teste de escala (Seção 6)</text>
</svg>
